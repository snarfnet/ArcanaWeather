name: ArcanaWeather
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "16.0"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 11.13.0

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.ArcanaWeather
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  ArcanaWeather:
    type: application
    platform: iOS
    sources: [ArcanaWeather]
    dependencies:
      - package: GoogleMobileAds
    settings:
      base:
        INFOPLIST_FILE: ArcanaWeather/Info.plist
        PRODUCT_NAME: ArcanaWeather
